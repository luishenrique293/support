<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Garena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Garena_logo.svg" alt="Garena" width="100">
                <span class="brand-name">Garena - Free Fire</span>
            </div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Knowledge base</a>
                <a href="#" class="btn-ticket">Submit a ticket</a>
                <a href="#">Login</a>
                <a href="#">Sign up</a>
            </nav>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <h1>SUPORTE BRASIL</h1>
            <p>ENCONTRE SUAS RESPOSTAS ABAIXO!</p>
            <div class="search-box">
                <input type="text" placeholder="Enter the search term here....">
                <button type="button">🔍</button>
            </div>
        </div>
    </section>

    <main class="knowledge-base">
        <h2>Knowledge base</h2>
        <a href="#" class="view-articles">View all articles</a>
        <div class="cards-grid">
            <div class="card"><div class="layers-icon"><span></span><span></span><span></span></div></div>
            <div class="card"><div class="layers-icon"><span></span><span></span><span></span></div></div>
            <div class="card"><div class="layers-icon"><span></span><span></span><span></span></div></div>
        </div>
    </main>

</body>
</html>
